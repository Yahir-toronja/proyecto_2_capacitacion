name: CI con Blacksmith

on:
  push:
    branches:
      - main
      - testing
      - dev

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm run lint

          - name: Typecheck
            command: pnpm exec tsc --noEmit

          - name: Tests
            command: pnpm run test

          - name: Build
            command: pnpm run build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ${{ matrix.name }}
        run: ${{ matrix.command }}

  docker:
    name: Construir y publicar imagen en ECR
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')
    needs: quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar claims OIDC usados por GitHub
        run: bash scripts/show-oidc-claims.sh

      - name: Instalar Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Cargar y validar configuración desde Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          bash scripts/load-doppler-env.sh
          AWS_ACCOUNT_ID
          AWS_REGION
          AWS_DEPLOY_ROLE_ARN
          ECR_REPOSITORY
          EC2_NAME_TAG
          NEXT_PUBLIC_CONVEX_URL
          NEXT_PUBLIC_CONVEX_SITE_URL
          CONVEX_DEPLOYMENT

      - name: Configurar credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}-${{ github.job }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Confirmar cuenta, región y repositorio ECR
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          current_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$current_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "ERROR: la sesión AWS pertenece a una cuenta inesperada"
            exit 1
          fi

          expected_repository_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          repository_uri="$(
            aws ecr describe-repositories \
              --region "$AWS_REGION" \
              --repository-names "$ECR_REPOSITORY" \
              --query 'repositories[0].repositoryUri' \
              --output text
          )"

          if [[ "$repository_uri" != "$expected_repository_uri" ]]; then
            echo "ERROR: el ECR no coincide con la cuenta y región configuradas"
            exit 1
          fi

          echo "ECR confirmado en ${AWS_REGION}"
          echo "image_uri=${repository_uri}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Builder de Blacksmith
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile

      - name: Preparar etiquetas
        id: docker-tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_REF_NAME}"
            echo "${{ steps.image.outputs.image_uri }}"

            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              echo "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen Docker
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ env.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ env.NEXT_PUBLIC_CONVEX_SITE_URL }}

  deploy-staging:
    name: Desplegar y verificar staging
    if: github.ref == 'refs/heads/testing'
    needs: docker
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      instance_id: ${{ steps.instance.outputs.instance_id }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Cargar y validar configuración desde Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          bash scripts/load-doppler-env.sh
          AWS_ACCOUNT_ID
          AWS_REGION
          AWS_DEPLOY_ROLE_ARN
          ECR_REPOSITORY
          EC2_NAME_TAG
          NEXT_PUBLIC_CONVEX_URL
          NEXT_PUBLIC_CONVEX_SITE_URL
          CONVEX_DEPLOYMENT

      - name: Configurar credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}-${{ github.job }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Validar imagen construida
        shell: bash
        env:
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
        run: |
          set -Eeuo pipefail
          expected_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          if [[ "$IMAGE_URI" != "$expected_image" ]]; then
            echo "ERROR: la imagen a desplegar no corresponde al SHA actual"
            exit 1
          fi

      - name: Localizar la única EC2 de aplicación
        id: instance
        shell: bash
        run: |
          set -Eeuo pipefail

          instance_ids="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=${EC2_NAME_TAG}" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text
          )"

          read -r -a instances <<< "$instance_ids"
          if [[ "${#instances[@]}" -ne 1 ]]; then
            echo "ERROR: se esperaba exactamente una EC2 running con Name=${EC2_NAME_TAG}; se encontraron ${#instances[@]}"
            exit 1
          fi

          echo "instance_id=${instances[0]}" >> "$GITHUB_OUTPUT"

      - name: Desplegar staging mediante Systems Manager
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
        run: >-
          bash scripts/deploy-via-ssm.sh
          "$INSTANCE_ID"
          "$IMAGE_URI"
          app-staging
          3001
          "$AWS_REGION"

  deploy-production:
    name: Desplegar y verificar producción
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Cargar y validar configuración desde Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          bash scripts/load-doppler-env.sh
          AWS_ACCOUNT_ID
          AWS_REGION
          AWS_DEPLOY_ROLE_ARN
          ECR_REPOSITORY
          EC2_NAME_TAG
          NEXT_PUBLIC_CONVEX_URL
          NEXT_PUBLIC_CONVEX_SITE_URL
          CONVEX_DEPLOYMENT

      - name: Configurar credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}-${{ github.job }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Validar imagen construida
        shell: bash
        env:
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
        run: |
          set -Eeuo pipefail
          expected_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          if [[ "$IMAGE_URI" != "$expected_image" ]]; then
            echo "ERROR: la imagen a desplegar no corresponde al SHA actual"
            exit 1
          fi

      - name: Localizar la única EC2 de aplicación
        id: instance
        shell: bash
        run: |
          set -Eeuo pipefail

          instance_ids="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:Name,Values=${EC2_NAME_TAG}" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text
          )"

          read -r -a instances <<< "$instance_ids"
          if [[ "${#instances[@]}" -ne 1 ]]; then
            echo "ERROR: se esperaba exactamente una EC2 running con Name=${EC2_NAME_TAG}; se encontraron ${#instances[@]}"
            exit 1
          fi

          echo "instance_id=${instances[0]}" >> "$GITHUB_OUTPUT"

      - name: Desplegar producción mediante Systems Manager
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
        run: >-
          bash scripts/deploy-via-ssm.sh
          "$INSTANCE_ID"
          "$IMAGE_URI"
          app-production
          3000
          "$AWS_REGION"
